# File: cfn/02-database.yaml
# Stack  : lab8-database  (deploy SECOND, after lab8-network)
# Creates: DB subnet group (the 2 isolated database subnets), RDS for MySQL 8.4 Single-AZ (Free Tier class),
#          master password managed by RDS in Secrets Manager, app user secret generated by Secrets Manager.
AWSTemplateFormatVersion: '2010-09-09'
Description: 'Lab 8 - Database layer: RDS for MySQL 8.4 Single-AZ in the database subnets, credentials in Secrets Manager'

Parameters:
  NetworkStackName:
    Type: String
    Default: lab8-network
    Description: Name of the network stack (its exports are imported)
  DBInstanceClass:
    Type: String
    Default: db.t4g.micro
    AllowedValues: [db.t4g.micro, db.t3.micro]
    Description: Free Tier eligible instance classes
  EngineVersion:
    Type: String
    Default: '8.4'
    Description: MySQL major version (RDS picks its default minor version)
  DBName:
    Type: String
    Default: labapp
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9_]{0,63}$'
  MasterUsername:
    Type: String
    Default: admin
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9_]{0,15}$'

Resources:
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupName: lab8-db-subnet-group
      DBSubnetGroupDescription: Lab 8 isolated database subnets (2 AZs)
      SubnetIds:
        - Fn::ImportValue: !Sub '${NetworkStackName}-DbSubnetA'
        - Fn::ImportValue: !Sub '${NetworkStackName}-DbSubnetB'

  Database:
    Type: AWS::RDS::DBInstance
    # Lab: delete everything with the stack. In production use Snapshot (the default for RDS) or Retain.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: lab8-mysql
      Engine: mysql
      EngineVersion: !Ref EngineVersion
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: '20'
      StorageType: gp2
      StorageEncrypted: true
      MultiAZ: false
      AvailabilityZone: !Select [0, !GetAZs '']
      PubliclyAccessible: false
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups:
        - Fn::ImportValue: !Sub '${NetworkStackName}-DbSG'
      DBName: !Ref DBName
      MasterUsername: !Ref MasterUsername
      ManageMasterUserPassword: true        # RDS creates and rotates the secret rds!db-...
      BackupRetentionPeriod: 1
      DeletionProtection: false
      AutoMinorVersionUpgrade: true
      CopyTagsToSnapshot: true
      Tags: [{ Key: Name, Value: lab8-mysql }]

  # Credentials of the least-privilege application user. The password is generated by
  # Secrets Manager: it never appears in the template, the parameters or the console events.
  AppUserSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: lab8/app/db
      Description: Lab 8 - appuser credentials used by the Flask app
      GenerateSecretString:
        SecretStringTemplate: '{"username": "appuser"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true
      Tags: [{ Key: Project, Value: lab8 }]

Outputs:
  DbEndpoint:
    Description: RDS endpoint name (use the name, never the IP, so TLS can verify it)
    Value: !GetAtt Database.Endpoint.Address
    Export: { Name: !Sub '${AWS::StackName}-DbEndpoint' }
  DbPort:
    Value: !GetAtt Database.Endpoint.Port
    Export: { Name: !Sub '${AWS::StackName}-DbPort' }
  DbName:
    Value: !Ref DBName
    Export: { Name: !Sub '${AWS::StackName}-DbName' }
  MasterSecretArn:
    Description: Secret created and managed by RDS for the master user
    Value: !GetAtt Database.MasterUserSecret.SecretArn
    Export: { Name: !Sub '${AWS::StackName}-MasterSecretArn' }
  AppSecretArn:
    Description: Secret holding the appuser credentials
    Value: !Ref AppUserSecret
    Export: { Name: !Sub '${AWS::StackName}-AppSecretArn' }
