# =============================================================================
# 03 · Apply on merge: plan (read-only identity) → policy gate → saved plan artifact
#      → APPROVAL (GitHub environment "app") → apply EXACTLY that plan (apply identity).
# 03 · Appliquer à la fusion : plan (identité en lecture seule) → porte de politiques → plan enregistré
#      → APPROBATION (environnement GitHub « app ») → appliquer EXACTEMENT ce plan (identité apply).
# =============================================================================
name: "03 · Apply app"

on:
  push:
    branches: [main]
    paths:
      - "infra/aws/app/**"
      - "infra/azure/app/**"
      - "infra/*/modules/**"
      - "policies/**"
  workflow_dispatch:

permissions: {}

# EN: NEVER cancel an apply halfway: queue runs instead.
# FR : Ne JAMAIS annuler un apply en cours : mettre les exécutions en file d'attente.
concurrency:
  group: apply-app
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"
  TF_VERSION: "~1.14.0"

jobs:
  # ===================================================================== AWS
  plan-aws:
    name: "Plan · AWS"
    if: vars.AWS_ENABLED == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
    defaults:
      run:
        working-directory: infra/aws/app
    env:
      STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: init
        run: |
          terraform init \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=module-11/aws/app.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="use_lockfile=true"

      - name: plan
        id: plan
        run: ../../../scripts/ci/plan.sh

      - name: policy gate (blocking) / porte de politiques (bloquante)
        run: |
          ../../../scripts/ci/install-conftest.sh
          conftest test plan.json -p "${GITHUB_WORKSPACE}/policies" --no-color

      # EN: The saved plan + the lock file travel together: apply must use the SAME provider versions.
      #     A plan can hold sensitive values: short retention, and only repo members can download artifacts.
      # FR : Le plan enregistré + le fichier de verrouillage voyagent ensemble : l'apply doit utiliser les MÊMES versions.
      #     Un plan peut contenir des valeurs sensibles : rétention courte, et seuls les membres du dépôt y ont accès.
      - name: upload the plan / téléverser le plan
        if: steps.plan.outputs.changes == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan-aws-app
          path: |
            infra/aws/app/tfplan
            infra/aws/app/.terraform.lock.hcl
            infra/aws/app/plan.txt
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  apply-aws:
    name: "Apply · AWS (environment: app)"
    needs: plan-aws
    if: needs.plan-aws.outputs.changes == 'true'
    runs-on: ubuntu-24.04
    # EN: Add required reviewers to this environment in Settings → Environments to get an approval step.
    # FR : Ajoutez des réviseurs obligatoires à cet environnement (Settings → Environments) pour avoir une approbation.
    environment: app
    permissions:
      contents: read
      id-token: write # EN: token sub = repo:<owner>/<repo>:environment:app / FR : sub du jeton = …:environment:app
    defaults:
      run:
        working-directory: infra/aws/app
    env:
      STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan-aws-app
          path: infra/aws/app

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN_APP }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: init (readonly lock file / fichier de verrouillage en lecture seule)
        run: |
          terraform init -lockfile=readonly \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=module-11/aws/app.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="use_lockfile=true"

      - name: show what will be applied / montrer ce qui sera appliqué
        run: cat plan.txt

      # EN: Terraform refuses a STALE plan (the state changed since it was made), which is exactly what we want.
      # FR : Terraform refuse un plan PÉRIMÉ (l'état a changé depuis), et c'est exactement ce que l'on veut.
      - name: apply the saved plan / appliquer le plan enregistré
        run: terraform apply -input=false tfplan

  # =================================================================== Azure
  plan-azure:
    name: "Plan · Azure"
    if: vars.AZURE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
    defaults:
      run:
        working-directory: infra/azure/app
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_PLAN_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      STATE_RG: ${{ vars.TF_STATE_RG }}
      STATE_SA: ${{ vars.TF_STATE_SA }}
      STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: init
        run: |
          terraform init \
            -backend-config="resource_group_name=${STATE_RG}" \
            -backend-config="storage_account_name=${STATE_SA}" \
            -backend-config="container_name=${STATE_CONTAINER}" \
            -backend-config="key=module-11/azure/app.tfstate" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"

      - name: plan
        id: plan
        run: ../../../scripts/ci/plan.sh

      - name: policy gate (blocking) / porte de politiques (bloquante)
        run: |
          ../../../scripts/ci/install-conftest.sh
          conftest test plan.json -p "${GITHUB_WORKSPACE}/policies" --no-color

      - name: upload the plan / téléverser le plan
        if: steps.plan.outputs.changes == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan-azure-app
          path: |
            infra/azure/app/tfplan
            infra/azure/app/.terraform.lock.hcl
            infra/azure/app/plan.txt
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  apply-azure:
    name: "Apply · Azure (environment: app)"
    needs: plan-azure
    if: needs.plan-azure.outputs.changes == 'true'
    runs-on: ubuntu-24.04
    environment: app
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/azure/app
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_APPLY_CLIENT_ID_APP }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      STATE_RG: ${{ vars.TF_STATE_RG }}
      STATE_SA: ${{ vars.TF_STATE_SA }}
      STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan-azure-app
          path: infra/azure/app

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: init (readonly lock file / fichier de verrouillage en lecture seule)
        run: |
          terraform init -lockfile=readonly \
            -backend-config="resource_group_name=${STATE_RG}" \
            -backend-config="storage_account_name=${STATE_SA}" \
            -backend-config="container_name=${STATE_CONTAINER}" \
            -backend-config="key=module-11/azure/app.tfstate" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"

      - name: show what will be applied / montrer ce qui sera appliqué
        run: cat plan.txt

      - name: apply the saved plan / appliquer le plan enregistré
        run: terraform apply -input=false tfplan
