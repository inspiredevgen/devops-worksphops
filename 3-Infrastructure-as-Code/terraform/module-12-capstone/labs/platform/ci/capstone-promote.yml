# =============================================================================
# Capstone promotion pipeline: copy into your Module 11 repository as
#   .github/workflows/20-capstone-promote.yml   (and the platform folder as capstone/)
# It reuses 10-terraform-env.yml from Module 11: plan → policy gate → approval → apply.
# Pipeline de promotion du projet final : à copier dans votre dépôt du module 11 sous
#   .github/workflows/20-capstone-promote.yml   (et le dossier platform sous capstone/)
# =============================================================================
name: "20 · Capstone: promote dev → prod"

on:
  push:
    branches: [main]
    paths:
      - "capstone/live/aws/**"
      - "capstone/live/azure/**"
      - "capstone/modules/**"
      - "policies/**"
  workflow_dispatch:

permissions: {}

concurrency:
  group: capstone-promote
  cancel-in-progress: false

jobs:
  aws-dev:
    if: vars.AWS_ENABLED == 'true'
    uses: ./.github/workflows/10-terraform-env.yml
    permissions:
      contents: read
      id-token: write
    with:
      cloud: aws
      environment: dev
      working-directory: capstone/live/aws/dev
      state-key: capstone/aws/dev.tfstate
      plan-identity: ${{ vars.AWS_PLAN_ROLE_ARN }}
      apply-identity: ${{ vars.AWS_APPLY_ROLE_ARN_DEV }}

  aws-prod:
    needs: aws-dev
    uses: ./.github/workflows/10-terraform-env.yml
    permissions:
      contents: read
      id-token: write
    with:
      cloud: aws
      environment: prod
      working-directory: capstone/live/aws/prod
      state-key: capstone/aws/prod.tfstate
      plan-identity: ${{ vars.AWS_PLAN_ROLE_ARN }}
      apply-identity: ${{ vars.AWS_APPLY_ROLE_ARN_PROD }}

  azure-dev:
    if: vars.AZURE_ENABLED == 'true'
    uses: ./.github/workflows/10-terraform-env.yml
    permissions:
      contents: read
      id-token: write
    with:
      cloud: azure
      environment: dev
      working-directory: capstone/live/azure/dev
      state-key: capstone/azure/dev.tfstate
      plan-identity: ${{ vars.AZURE_PLAN_CLIENT_ID }}
      apply-identity: ${{ vars.AZURE_APPLY_CLIENT_ID_DEV }}

  azure-prod:
    needs: azure-dev
    uses: ./.github/workflows/10-terraform-env.yml
    permissions:
      contents: read
      id-token: write
    with:
      cloud: azure
      environment: prod
      working-directory: capstone/live/azure/prod
      state-key: capstone/azure/prod.tfstate
      plan-identity: ${{ vars.AZURE_PLAN_CLIENT_ID }}
      apply-identity: ${{ vars.AZURE_APPLY_CLIENT_ID_PROD }}
