# =============================================================================
# Lab 7 · azure · advanced — day-2 operations / opérations de jour 2
# =============================================================================
[defaults]
inventory = inventory/
# EN: The Module 6 roles (web, baseline) are reused as they are. / FR : Les rôles du module 6 sont réutilisés tels quels.
roles_path = ../../../../module-06-roles/labs/shared/intermediate/roles
collections_path = ./collections:~/.ansible/collections
interpreter_python = auto_silent
forks = 10
callback_result_format = yaml
host_key_checking = True
retry_files_enabled = False

[inventory]
enable_plugins = azure.azcollection.azure_rm, ansible.builtin.yaml
any_unparsed_is_failed = True

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/known_hosts_ansible_lab
pipelining = True
