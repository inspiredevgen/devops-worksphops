---
# =============================================================================
# EN: Handoff "cloud-init → Ansible": a VM that answers SSH is NOT necessarily ready. cloud-init may still be
#     writing users, keys, apt sources, or holding the package lock. Wait for both, then gather facts.
# FR : Relais « cloud-init → Ansible » : une VM qui répond en SSH n'est PAS forcément prête. cloud-init peut encore
#     écrire utilisateurs, clés, sources apt, ou tenir le verrou des paquets. Attendre les deux, puis collecter les faits.
# =============================================================================
- name: Wait until the host answers over SSH (new VMs take a minute)
  ansible.builtin.wait_for_connection:
    timeout: 300

- name: Wait until cloud-init has finished
  ansible.builtin.command: cloud-init status --wait
  register: cloud_init
  changed_when: false
  # EN: 0 = done, 2 = done with recoverable errors (logged, not fatal) / FR : 0 = terminé, 2 = terminé avec erreurs récupérables
  failed_when: cloud_init.rc not in [0, 2]

- name: Gather facts once the host is ready
  ansible.builtin.setup:
