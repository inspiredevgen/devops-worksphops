# =============================================================================
# Lab 7 · aws · intermediate — Terraform from a playbook + terraform_state inventory / Terraform depuis un playbook + inventaire terraform_state
# =============================================================================
[defaults]
# EN: inventory/lab.terraform_state.yml is generated by make-state-inventory.sh (absolute path to the state).
# FR : inventory/lab.terraform_state.yml est généré par make-state-inventory.sh (chemin absolu vers l'état).
inventory = inventory/
# EN: The Module 6 roles (web, baseline) are reused as they are. / FR : Les rôles du module 6 sont réutilisés tels quels.
roles_path = ../../../../module-06-roles/labs/shared/intermediate/roles
collections_path = ./collections:~/.ansible/collections
interpreter_python = auto_silent
forks = 10
callback_result_format = yaml
host_key_checking = True
retry_files_enabled = False

[inventory]
enable_plugins = cloud.terraform.terraform_state, ansible.builtin.host_list, ansible.builtin.yaml
# EN: Exception to the course rule: BEFORE the first apply there is no state, so this source can't be parsed yet.
#     provision.yml asserts after refresh_inventory that the state DID produce hosts (no silent empty run).
# FR : Exception à la règle du cours : AVANT le premier apply il n'y a pas d'état, cette source est donc illisible.
#     provision.yml vérifie après refresh_inventory que l'état a BIEN produit des hôtes (pas d'exécution vide en silence).
any_unparsed_is_failed = False

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/known_hosts_ansible_lab
pipelining = True
