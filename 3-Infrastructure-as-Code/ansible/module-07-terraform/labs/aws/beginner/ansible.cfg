# =============================================================================
# Lab 7 · aws · beginner — Terraform builds, Ansible configures (outputs → inventory) / Terraform construit, Ansible configure
# =============================================================================
[defaults]
# EN: Only the control node: every managed host comes from the Terraform output (add_host).
# FR : Seulement le nœud de contrôle : chaque hôte géré vient de la sortie Terraform (add_host).
inventory = inventory.yml
# EN: The Module 6 roles (web, baseline) are reused as they are. / FR : Les rôles du module 6 sont réutilisés tels quels.
roles_path = ../../../../module-06-roles/labs/shared/intermediate/roles
collections_path = ./collections:~/.ansible/collections
interpreter_python = auto_silent
forks = 10
callback_result_format = yaml
host_key_checking = True
retry_files_enabled = False

[inventory]
enable_plugins = ansible.builtin.yaml
any_unparsed_is_failed = True

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/known_hosts_ansible_lab
pipelining = True
