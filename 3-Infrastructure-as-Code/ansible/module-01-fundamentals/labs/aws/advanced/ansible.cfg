# =============================================================================
# Lab 1 · aws · advanced — private hosts: jump host, then SSM / hôtes privés : rebond, puis SSM
# EN: Ansible reads THIS file because it is in the current directory (precedence: ANSIBLE_CONFIG >
#     ./ansible.cfg > ~/.ansible.cfg > /etc/ansible/ansible.cfg). Check: ansible-config dump --only-changed
# FR : Ansible lit CE fichier car il est dans le répertoire courant (priorité : ANSIBLE_CONFIG >
#     ./ansible.cfg > ~/.ansible.cfg > /etc/ansible/ansible.cfg). Vérifier : ansible-config dump --only-changed
# =============================================================================
[defaults]
inventory = inventory.yml
interpreter_python = auto_silent
forks = 10
callback_result_format = yaml
host_key_checking = True
retry_files_enabled = False

[ssh_connection]
# EN: ControlPersist reuses one SSH connection per host; accept-new trusts a NEW host key once and
#     refuses a CHANGED one. A separate known_hosts file keeps lab hosts out of your real one.
# FR : ControlPersist réutilise une connexion SSH par hôte ; accept-new accepte une NOUVELLE clé d'hôte
#     une fois et refuse une clé MODIFIÉE. Un known_hosts séparé garde les hôtes de lab hors du vôtre.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/known_hosts_ansible_lab
pipelining = True
# EN: proxyjump: the ProxyCommand comes from the generated inventory (all.vars.ansible_ssh_common_args).
#     ssm (part 2): inventory-ssm.yml sets ansible_connection=amazon.aws.aws_ssm; [ssh_connection] is then unused.
# FR : proxyjump : le ProxyCommand vient de l'inventaire généré (all.vars.ansible_ssh_common_args).
#     ssm (partie 2) : inventory-ssm.yml définit ansible_connection=amazon.aws.aws_ssm ; [ssh_connection] est alors inutilisé.
