# =============================================================================
# Lab 1 · azure · advanced — private VMs through Bastion tunnels, tuning measured / VM privées par tunnels Bastion, réglages mesurés
# EN: Ansible reads THIS file because it is in the current directory (precedence: ANSIBLE_CONFIG >
#     ./ansible.cfg > ~/.ansible.cfg > /etc/ansible/ansible.cfg). Check: ansible-config dump --only-changed
# FR : Ansible lit CE fichier car il est dans le répertoire courant (priorité : ANSIBLE_CONFIG >
#     ./ansible.cfg > ~/.ansible.cfg > /etc/ansible/ansible.cfg). Vérifier : ansible-config dump --only-changed
# =============================================================================
[defaults]
inventory = inventory.yml
interpreter_python = auto_silent
forks = 10
callback_result_format = yaml
host_key_checking = True
retry_files_enabled = False

[ssh_connection]
# EN: Every host is 127.0.0.1 on a different port, so known_hosts is keyed by [127.0.0.1]:port.
#     If you destroy and re-create the VMs, the keys change: ssh-keygen -R "[127.0.0.1]:50022" -f ~/.ssh/known_hosts_ansible_lab
# FR : Chaque hôte est 127.0.0.1 sur un port différent ; known_hosts est indexé par [127.0.0.1]:port.
#     Si vous recréez les VM, les clés changent : ssh-keygen -R "[127.0.0.1]:50022" -f ~/.ssh/known_hosts_ansible_lab
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/known_hosts_ansible_lab
pipelining = True
