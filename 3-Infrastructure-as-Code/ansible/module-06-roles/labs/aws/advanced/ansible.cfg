# =============================================================================
# Lab 6 · aws · advanced — consume a versioned collection / utiliser une collection versionnée
# EN: Same dynamic inventory as Module 4 (inventory/).
# FR : Même inventaire dynamique qu'au module 4 (inventory/).
# =============================================================================
[defaults]
inventory = inventory/
# EN: Collections installed for THIS project win over the ones in your home directory.
# FR : Les collections installées pour CE projet passent avant celles de votre répertoire personnel.
collections_path = ./collections:~/.ansible/collections
interpreter_python = auto_silent
forks = 10
callback_result_format = yaml
host_key_checking = True
retry_files_enabled = False

[inventory]
# EN: Only these plugins may parse files in inventory/ (faster, and no surprise parsers).
# FR : Seuls ces plugins peuvent lire les fichiers de inventory/ (plus rapide, sans analyseur surprise).
enable_plugins = amazon.aws.aws_ec2, ansible.builtin.constructed, ansible.builtin.yaml, ansible.builtin.ini
# EN: A plugin config that fails to parse is an ERROR, not a warning (no silently empty inventory).
# FR : Une configuration de plugin illisible est une ERREUR, pas un avertissement (pas d'inventaire vide en silence).
any_unparsed_is_failed = True

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/known_hosts_ansible_lab
pipelining = True
