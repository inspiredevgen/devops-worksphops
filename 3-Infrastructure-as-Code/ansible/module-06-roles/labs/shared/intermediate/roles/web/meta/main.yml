---
galaxy_info:
  role_name: web
  author: DevOps Workshops
  description: nginx + atomic releases (current symlink, /healthz drain switch) on Ubuntu and the RHEL family
  license: MIT
  min_ansible_version: "2.21"
  platforms:
    - name: Ubuntu
      versions: [noble]
    - name: EL
      versions: ["9"]
    # EN: Galaxy's platform list stops at old Amazon Linux releases: "all" + the README say AL2023.
    # FR : La liste de Galaxy s'arrête aux anciennes versions d'Amazon Linux : « all » + le README précisent AL2023.
    - name: Amazon
      versions: [all]
  galaxy_tags: [web, nginx, release]

# EN: Runs BEFORE this role, once per play, with these values. Convenient, but hidden from the playbook reader:
#     many teams prefer listing both roles explicitly in the playbook.
# FR : S'exécute AVANT ce rôle, une fois par play, avec ces valeurs. Pratique, mais caché au lecteur du playbook :
#     beaucoup d'équipes préfèrent lister les deux rôles explicitement dans le playbook.
dependencies:
  - role: baseline
    vars:
      baseline_motd_message: "Web server: changes go through the release pipeline."
