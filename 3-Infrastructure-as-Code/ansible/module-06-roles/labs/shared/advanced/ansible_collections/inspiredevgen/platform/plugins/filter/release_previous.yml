DOCUMENTATION:
  name: release_previous
  author: DevOps Workshops
  version_added: 1.0.0
  short_description: The release just before a given one
  description:
    - Returns the release that precedes O(current) in natural order, or V(None).
  options:
    _input:
      description: List of release names.
      type: list
      elements: str
      required: true
    current:
      description: The release to start from.
      type: str
      required: true
EXAMPLES: |
  rollback_to: "{{ ['v1', 'v2', 'v10'] | inspiredevgen.platform.release_previous('v10') }}"   # v2
RETURN:
  _value:
    description: The previous release, or None.
    type: str
