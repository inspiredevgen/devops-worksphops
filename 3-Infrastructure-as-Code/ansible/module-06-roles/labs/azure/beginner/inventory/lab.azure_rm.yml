---
# =============================================================================
# Lab 5 — the same dynamic inventory as Lab 4.B (the role_web group is what Lab 5.A rolls through). The file name MUST end in azure_rm.yml (or .yaml).
#   Needs the Azure SDK in the venv: ../../../../module-00-setup/labs/shared/setup-control-node.sh --azure
#   ansible-inventory --graph        ansible-inventory --host web1
# Lab 4.B-AZ — L'API Azure Resource Manager est l'inventaire. Le nom du fichier DOIT finir par azure_rm.yml.
# =============================================================================
plugin: azure.azcollection.azure_rm

# EN: Use your "az login" session (no secrets in files). In CI: a service principal or OIDC (Module 10).
# FR : Utilise votre session « az login » (aucun secret dans les fichiers). En CI : principal de service ou OIDC.
auth_source: cli

# EN: Only the lab resource group, and only OUR VMs (the default filters already drop stopped VMs).
# FR : Seulement le groupe de ressources du lab, et seulement NOS VM (les filtres par défaut écartent déjà les VM arrêtées).
include_vm_resource_groups:
  - rg-ans-lab-hosts
exclude_host_filters:
  - tags.Course | default('') != 'ansible-cloud-engineer'

# EN: inventory_hostname = the Host tag (web1), else the plugin's default name.
# FR : inventory_hostname = l'étiquette Host (web1), sinon le nom par défaut du plugin.
plain_host_names: true
hostnames:
  - tags.Host | default('')
  - default

# EN: Host variables from what the API returns. Static strings need BOTH quote levels: "'azure'".
# FR : Variables d'hôte à partir de ce que renvoie l'API. Les chaînes fixes exigent DEUX niveaux de guillemets : "'azure'".
hostvar_expressions:
  ansible_host: (public_ipv4_address + private_ipv4_addresses) | first
  ansible_user: "'azureuser'"
  cloud: "'azure'"
  cloud_vm_name: name

# EN: One group per tag value: role_web, env_dev, os_ubuntu… plus the region.
# FR : Un groupe par valeur d'étiquette : role_web, env_dev, os_ubuntu… plus la région.
keyed_groups:
  - key: tags.Role | default('none')
    prefix: role
  - key: tags.Environment | default('none')
    prefix: env
  - key: tags.OS | default('none')
    prefix: os
  - key: location
    prefix: region

# EN: Groups from conditions. / FR : Groupes à partir de conditions.
conditional_groups:
  linux: os_profile.system == 'linux'
