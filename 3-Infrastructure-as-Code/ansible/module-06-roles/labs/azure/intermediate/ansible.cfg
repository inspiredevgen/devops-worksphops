# =============================================================================
# Lab 6 · azure · intermediate — validated roles + dependency / rôles validés + dépendance
# EN: Same dynamic inventory as Module 4 (inventory/).
# FR : Même inventaire dynamique qu'au module 4 (inventory/).
# =============================================================================
[defaults]
inventory = inventory/
interpreter_python = auto_silent
forks = 10
callback_result_format = yaml
host_key_checking = True
retry_files_enabled = False

[inventory]
enable_plugins = azure.azcollection.azure_rm, ansible.builtin.constructed, ansible.builtin.yaml, ansible.builtin.ini
any_unparsed_is_failed = True

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/known_hosts_ansible_lab
pipelining = True
