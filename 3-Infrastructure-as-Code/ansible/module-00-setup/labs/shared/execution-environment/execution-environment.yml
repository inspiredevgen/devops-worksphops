---
# =============================================================================
# EN: The course execution environment (EE): the SAME ansible-core, collections and Python SDKs
#     for every student and for CI. Build: ansible-builder build -t ansible-course-ee:m00
# FR : L'environnement d'exécution (EE) du cours : le MÊME ansible-core, les mêmes collections et SDK
#     pour chaque étudiant et pour la CI. Construction : ansible-builder build -t ansible-course-ee:m00
# =============================================================================
version: 3

images:
  base_image:
    name: quay.io/fedora/fedora:42

dependencies:
  python_interpreter:
    package_system: python3
    python_path: /usr/bin/python3
  ansible_core:
    package_pip: ansible-core>=2.21,<2.22
  ansible_runner:
    package_pip: ansible-runner
  galaxy: ../../../../requirements.yml
  python:
    - boto3>=1.35
    - botocore>=1.35
    - jmespath
  system:
    - openssh-clients [platform:rpm]
    - sshpass [platform:rpm]
    - git-core [platform:rpm]

options:
  package_manager_path: /usr/bin/dnf
  tags:
    - ansible-course-ee:m00

additional_build_steps:
  append_final:
    # EN: SSM connection plugin needs the Session Manager plugin inside the EE.
    # FR : Le plugin de connexion SSM exige le Session Manager plugin dans l'EE.
    - RUN dnf install -y https://s3.amazonaws.com/session-manager-downloads/plugin/latest/linux_64bit/session-manager-plugin.rpm && dnf clean all
