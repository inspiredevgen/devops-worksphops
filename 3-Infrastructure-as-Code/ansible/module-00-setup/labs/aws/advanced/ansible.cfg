# =============================================================================
# Lab 0 · aws · advanced — no SSH: SSM connection plugin / pas de SSH : plugin de connexion SSM
# EN: Ansible reads THIS file because it is in the current directory (precedence: ANSIBLE_CONFIG >
#     ./ansible.cfg > ~/.ansible.cfg > /etc/ansible/ansible.cfg). Check: ansible-config dump --only-changed
# FR : Ansible lit CE fichier car il est dans le répertoire courant (priorité : ANSIBLE_CONFIG >
#     ./ansible.cfg > ~/.ansible.cfg > /etc/ansible/ansible.cfg). Vérifier : ansible-config dump --only-changed
# =============================================================================
[defaults]
inventory = inventory.yml
interpreter_python = auto_silent
forks = 10
callback_result_format = yaml
host_key_checking = True
retry_files_enabled = False
# EN: Each host sets ansible_connection=amazon.aws.aws_ssm in the generated inventory; the S3 bucket
#     and region come from the inventory group vars. No port 22, no key pair, no public SSH.
# FR : Chaque hôte définit ansible_connection=amazon.aws.aws_ssm dans l'inventaire généré ; le
#     compartiment S3 et la région viennent des variables de groupe. Ni port 22, ni paire de clés.
timeout = 60
