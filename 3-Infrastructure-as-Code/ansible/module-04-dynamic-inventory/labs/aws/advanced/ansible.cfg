# =============================================================================
# Lab 4 · aws · advanced — ONE multi-cloud inventory: AWS + Azure + constructed, cached
# Lab 4 · aws · avancé — UN inventaire multi-cloud : AWS + Azure + constructed, en cache
# EN: Only one cloud account? Override the sources:
#       ansible-inventory -i ../../shared/advanced/inventory/10-aws.aws_ec2.yml -i ../../shared/advanced/inventory/90-constructed.yml --graph
# FR : Un seul compte cloud ? Remplacez les sources par -i (voir ci-dessus).
# =============================================================================
[defaults]
inventory = ../../shared/advanced/inventory
interpreter_python = auto_silent
forks = 10
callback_result_format = yaml
host_key_checking = True
retry_files_enabled = False

[inventory]
enable_plugins = amazon.aws.aws_ec2, azure.azcollection.azure_rm, ansible.builtin.constructed, ansible.builtin.yaml, ansible.builtin.ini
any_unparsed_is_failed = True

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/known_hosts_ansible_lab
pipelining = True
