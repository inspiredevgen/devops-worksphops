# =============================================================================
# Lab 4 · azure · advanced — the same multi-cloud inventory, Azure source FIRST
# Lab 4 · azure · avancé — le même inventaire multi-cloud, source Azure EN PREMIER
# EN: Sources are read in the order listed: Azure, then AWS, then constructed (which must stay last).
#     Only Azure? -i ../../shared/advanced/inventory/20-azure.azure_rm.yml -i ../../shared/advanced/inventory/90-constructed.yml
# FR : Les sources sont lues dans l'ordre indiqué : Azure, puis AWS, puis constructed (qui doit rester dernier).
# =============================================================================
[defaults]
inventory = ../../shared/advanced/inventory/20-azure.azure_rm.yml, ../../shared/advanced/inventory/10-aws.aws_ec2.yml, ../../shared/advanced/inventory/90-constructed.yml
interpreter_python = auto_silent
forks = 10
callback_result_format = yaml
host_key_checking = True
retry_files_enabled = False

[inventory]
enable_plugins = azure.azcollection.azure_rm, amazon.aws.aws_ec2, ansible.builtin.constructed, ansible.builtin.yaml, ansible.builtin.ini
any_unparsed_is_failed = True

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/known_hosts_ansible_lab
pipelining = True
