# =============================================================================
# Lab 4 · azure · intermediate — one inventory per environment / un inventaire par environnement
# EN: The DEFAULT inventory is dev. Prod needs an explicit -i inventories/prod: a forgotten -i can't hit prod.
# FR : L'inventaire PAR DÉFAUT est dev. La prod exige un -i inventories/prod explicite : un -i oublié ne touche jamais la prod.
# =============================================================================
[defaults]
inventory = inventories/dev
interpreter_python = auto_silent
forks = 10
callback_result_format = yaml
host_key_checking = True
retry_files_enabled = False

[inventory]
enable_plugins = azure.azcollection.azure_rm, ansible.builtin.constructed, ansible.builtin.yaml, ansible.builtin.ini
any_unparsed_is_failed = True

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/known_hosts_ansible_lab
pipelining = True
